# gita.rpandox.com behind Cloudflare (proxied, Full (strict)): the Bhagavad Gita reader, a static site in the `gita`
# container on 127.0.0.1:3400. Installed as /etc/nginx/sites-available/gita.conf (docs/DEPLOY.md). It has its own
# certificate, so the platform's certificate and pandox.conf are not involved. The shared snippets it includes are
# read only here.

upstream gita_app {
    server 127.0.0.1:3400;
    keepalive 8;
}

# Port 80: certbot's webroot challenges, everything else to https.
server {
    listen 80;
    listen [::]:80;
    server_name gita.rpandox.com;
    include /etc/nginx/snippets/cloudflare-realip.conf;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://gita.rpandox.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gita.rpandox.com;

    ssl_certificate /etc/letsencrypt/live/gita.rpandox.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gita.rpandox.com/privkey.pem;
    # Same TLS settings as snippets/rpandox-tls.conf, which cannot be included because it names the other certificate.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:rpandox_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/cloudflare-realip.conf;
    include /etc/nginx/snippets/pandox-proxy.conf;
    # nosniff, referrer policy, no framing, HSTS. The container sets the cache headers.
    include /etc/nginx/snippets/pandox-headers.conf;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://gita_app;
    }
}
