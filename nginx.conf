# gita-next in its container: the exported site on 3400. Host nginx in front adds TLS and the security headers.
server {
    listen 3400;
    server_tokens off;
    root /usr/share/nginx/html;

    # The verse data is about 4 MB of JSON; gzip brings it to roughly a fifth.
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Next's content-hashed files never change at a given URL. A missing one is a plain 404, never the page:
    # the reader reloads itself when a script from an older deploy is gone (app/layout.jsx).
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Font files keep their names across deploys, so a long but not unlimited life.
    location /fonts/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # nginx's type list has no .webmanifest; browsers want this type before they offer install.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # The service worker script decides when readers get new data. no-store keeps Cloudflare from holding an old
    # copy at its edge (it would otherwise cache .js for hours whatever this server says).
    location = /sw.js {
        add_header Cache-Control "no-store";
    }

    # Everything else (the page, /data/*.json, icons) is revalidated on every load, so a deploy shows at once.
    # The service worker keeps its own copy of the data for offline reading (public/sw.js).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
}
